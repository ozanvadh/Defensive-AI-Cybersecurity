<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="white"/>
<text x="500" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Historical Generalization vs Controlled Synthetic Distribution</text>
<text x="500" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Positive-class recall/detection rate for the same frozen classifiers</text>
<rect x="300" y="88" width="18" height="18" fill="#4C78A8"/><text x="328" y="102" font-family="Arial, sans-serif" font-size="14">Historical final-test recall</text>
<rect x="545" y="88" width="18" height="18" fill="#F58518"/><text x="573" y="102" font-family="Arial, sans-serif" font-size="14">Controlled synthetic detection</text>
<line x1="100" y1="135" x2="100" y2="500" stroke="#222" stroke-width="1.5"/>
<line x1="100" y1="500" x2="950" y2="500" stroke="#222" stroke-width="1.5"/>
<g font-family="Arial, sans-serif" font-size="13" fill="#333">
<line x1="100" y1="500" x2="950" y2="500" stroke="#ddd"/><text x="88" y="505" text-anchor="end">0%</text>
<line x1="100" y1="427" x2="950" y2="427" stroke="#ddd"/><text x="88" y="432" text-anchor="end">20%</text>
<line x1="100" y1="354" x2="950" y2="354" stroke="#ddd"/><text x="88" y="359" text-anchor="end">40%</text>
<line x1="100" y1="281" x2="950" y2="281" stroke="#ddd"/><text x="88" y="286" text-anchor="end">60%</text>
<line x1="100" y1="208" x2="950" y2="208" stroke="#ddd"/><text x="88" y="213" text-anchor="end">80%</text>
<line x1="100" y1="135" x2="950" y2="135" stroke="#ddd"/><text x="88" y="140" text-anchor="end">100%</text>
</g>
<text x="30" y="320" transform="rotate(-90 30 320)" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Detection / Recall (%)</text>
<rect x="195" y="140.6" width="120" height="359.4" fill="#4C78A8"/>
<rect x="325" y="297.8" width="120" height="202.2" fill="#F58518"/>
<rect x="610" y="138.1" width="120" height="361.9" fill="#4C78A8"/>
<rect x="740" y="367.9" width="120" height="132.1" fill="#F58518"/>
<g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#222">
<text x="255" y="130" text-anchor="middle">98.47%</text>
<text x="385" y="287" text-anchor="middle">55.40%</text>
<text x="670" y="128" text-anchor="middle">99.16%</text>
<text x="800" y="357" text-anchor="middle">36.20%</text>
</g>
<g font-family="Arial, sans-serif" font-size="15" fill="#222">
<text x="320" y="530" text-anchor="middle">TF-IDF + Logistic Regression</text>
<text x="735" y="530" text-anchor="middle">DistilBERT</text>
</g>
<text x="500" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Synthetic evaluation contains 500 positive-class messages, so synthetic precision, FPR, and overall accuracy are not estimated.</text>
</svg>